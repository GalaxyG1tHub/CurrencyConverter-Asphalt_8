<!-- settings.html (Settings Page) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asphalt 8 Currency Converter: Settings</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .back-arrow {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: gray;
            padding: 10px;
            border-radius: 10px;
            width: fit-content;
            margin: auto;
        }
        .toggle-container.active {
            background-color: green;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #4CAF50;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
    </style>
</head>
<body>
    <a href="CURRENCYCONVERSION.HTML.html" class="back-arrow">⬅ Back</a>

    <h1>ASPHALT 8 CURRENCY CONVERTER: SETTINGS</h1>
    <hr>

    <!-- Toggle for Gauntlet Badges -->
    <div class="toggle-container">
        <h3>SHOW DISCONTINUED CURRENCIES (Gauntlet Badges)</h3>
        <label class="switch">
            <input type="checkbox" id="currency-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggleSwitch = document.getElementById("currency-toggle");

            // Load saved setting from localStorage
            const isEnabled = localStorage.getItem("showDiscontinuedCurrencies") === "true";
            toggleSwitch.checked = isEnabled;

            toggleSwitch.addEventListener("change", function () {
                const isChecked = toggleSwitch.checked;
                localStorage.setItem("showDiscontinuedCurrencies", isChecked);
            });
        });
    </script>
</body>
</html>
